name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          args: check .
      - uses: astral-sh/ruff-action@v3
        with:
          args: format --check .

  tests:
    name: Tests unitaires (hors-ligne) — Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-parquet.txt -r requirements-dev.txt
      # TRADEHELPER_NETWORK_TESTS non défini -> les tests réseau (marqués) sont skippés
      - name: Suite pytest + couverture (objectif > 80 % sur le cœur)
        run: >
          python -m pytest
          --cov=tradehelper.indicators --cov=tradehelper.backtest
          --cov=tradehelper.strategies --cov=tradehelper.screener
          --cov-report=term --cov-fail-under=80

  mypy:
    name: Typage strict (cœur)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt mypy
      - name: mypy --strict (backtest, strategies, screener)
        run: python -m mypy

  secrets:
    name: Scan de secrets (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
